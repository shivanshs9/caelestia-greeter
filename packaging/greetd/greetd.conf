# Caelestia Greeter configuration for greetd.
#
# greetd reads /etc/greetd/greetd.conf before /etc/greetd/config.toml, and
# package upgrades only touch config.toml, so this file survives upgrades.

[terminal]
vt = 1

[default_session]
command = "/usr/local/bin/caelestia-greeter-compositor"
user = "greeter"
