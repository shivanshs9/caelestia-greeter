# Installed to /etc/systemd/system/greetd.service.d/caelestia-greeter.conf.
# The installer appends Environment=CAELESTIA_GREETER_USER=<user> so the
# profile cache always follows the account chosen at install time.
#
# The leading "-" means a failure in the profile synchroniser (missing font,
# unreadable home, bug) only costs the wallpaper and avatar; it can never keep
# greetd, and therefore the login screen, from starting.
[Service]
ExecStartPre=-/usr/local/bin/caelestia-greeter-profile-sync
